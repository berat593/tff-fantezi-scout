<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TFF Fantezi Lig Pro Scout & xP Kadro Çözücü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 0.75rem; }
    .pitch-bg {
      background: radial-gradient(circle at center, #14532d 0%, #064e3b 100%);
      border: 2px solid rgba(255,255,255,0.2);
      position: relative;
    }
    .badge-oop { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6">

  <!-- Üst Başlık & Veri Yükleme Paneli -->
  <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-gray-800 pb-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">
        ⚽ TFF Fantezi Lig <span class="text-emerald-400">Pro Scout & xP Motoru</span>
      </h1>
      <p class="text-sm text-gray-400 mt-1">
        Alt-Metrik (xG/xA), Mevki Dışı (OOP), Poisson Gol Yememe ve 100M TL MILP Kadro Çözücü
      </p>
    </div>
    <div class="flex items-center gap-3">
      <label class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold cursor-pointer transition flex items-center gap-2">
        📁 Canlı Veri Yükle (.json)
        <input type="file" id="json-file-input" accept=".json" onchange="handleFileUpload(event)" class="hidden" />
      </label>
    </div>
  </header>

  <!-- Parametre Kontrol Paneli -->
  <section class="max-w-7xl mx-auto card p-4 mb-6 grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
    <div>
      <label class="text-xs text-gray-400 font-semibold flex justify-between">
        <span>Alt-Metrik (xG+xA) Ağırlığı</span>
        <span id="lbl-xg" class="text-emerald-400 font-bold">1.25x</span>
      </label>
      <input id="sl-xg" type="range" min="0.5" max="2.0" step="0.05" value="1.25" oninput="recalculateAll()" class="w-full accent-emerald-500 mt-1" />
    </div>
    <div>
      <label class="text-xs text-gray-400 font-semibold flex justify-between">
        <span>Eşleşme & Duran Top Çarpanı</span>
        <span id="lbl-matchup" class="text-emerald-400 font-bold">1.20x</span>
      </label>
      <input id="sl-matchup" type="range" min="0.8" max="1.6" step="0.05" value="1.20" oninput="recalculateAll()" class="w-full accent-emerald-500 mt-1" />
    </div>
    <div>
      <label class="text-xs text-gray-400 font-semibold flex justify-between">
        <span>Maksimum Seçilme (Niş Sınırı)</span>
        <span id="lbl-own" class="text-emerald-400 font-bold">%12</span>
      </label>
      <input id="sl-own" type="range" min="3" max="30" step="1" value="12" oninput="recalculateAll()" class="w-full accent-emerald-500 mt-1" />
    </div>
    <div class="flex gap-2 justify-end">
      <button onclick="switchTab('radar')" id="tab-radar" class="px-3 py-2 rounded-lg text-xs font-bold bg-emerald-600 text-white">🎯 Niş Radar</button>
      <button onclick="switchTab('table')" id="tab-table" class="px-3 py-2 rounded-lg text-xs font-bold bg-gray-800 text-gray-300">📊 Tüm Havuz</button>
      <button onclick="switchTab('solver')" id="tab-solver" class="px-3 py-2 rounded-lg text-xs font-bold bg-gray-800 text-gray-300">⚽ 100M Kadro Çözücü</button>
    </div>
  </section>

  <!-- SEKME 1: NİŞ RADAR -->
  <main id="view-radar" class="max-w-7xl mx-auto space-y-4">
    <div class="flex flex-wrap gap-2 mb-2">
      <button onclick="setRadarFilter('ALL')" class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-white">Tümü</button>
      <button onclick="setRadarFilter('XG_DIFF')" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-900/40 text-emerald-300 border border-emerald-700/50">🔥 Patlama Beklenenler (+ΔxGI)</button>
      <button onclick="setRadarFilter('OOP')" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-900/40 text-amber-300 border border-amber-700/50">⚡ Mevki Dışı (OOP)</button>
    </div>
    <div id="radar-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
  </main>

  <!-- SEKME 2: TÜM OYUNCULAR TABLOSU -->
  <section id="view-table" class="max-w-7xl mx-auto hidden">
    <div class="card overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead class="bg-gray-900/80 text-gray-400 uppercase border-b border-gray-800">
          <tr>
            <th class="p-3">Oyuncu</th>
            <th class="p-3">Takım</th>
            <th class="p-3">Mevki</th>
            <th class="p-3">Fiyat</th>
            <th class="p-3">Seçilme</th>
            <th class="p-3">xG+xA / 90</th>
            <th class="p-3 text-emerald-400">Beklenen Puan (xP)</th>
            <th class="p-3">Kilit</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-gray-800"></tbody>
      </table>
    </div>
  </section>

  <!-- SEKME 3: 100M TL KADRO ÇÖZÜCÜ -->
  <section id="view-solver" class="max-w-7xl mx-auto hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="card p-4 space-y-4">
      <h2 class="text-lg font-bold text-white">⚙️ Optimizasyon Kısıtları</h2>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="p-3 rounded-lg bg-gray-900">
          <div class="text-gray-400">Toplam Bütçe</div>
          <div id="squad-cost" class="text-xl font-extrabold text-white mt-1">0.0 / 100.0M</div>
        </div>
        <div class="p-3 rounded-lg bg-gray-900">
          <div class="text-gray-400">Haftalık Toplam xP</div>
          <div id="squad-xp" class="text-xl font-extrabold text-emerald-400 mt-1">0.0 Puan</div>
        </div>
      </div>
      <div>
        <label class="text-xs text-gray-400 font-semibold">Formasyon</label>
        <select id="sel-formation" onchange="solveOptimalSquad()" class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white">
          <option value="3-4-3">3-4-3 (Hücum Odaklı)</option>
          <option value="3-5-2">3-5-2 (Orta Saha Odaklı)</option>
          <option value="4-4-2">4-4-2 (Dengeli)</option>
        </select>
      </div>
    </div>
    <div class="lg:col-span-2 pitch-bg rounded-xl p-6 min-h-[480px] flex flex-col justify-between" id="pitch-container"></div>
  </section>

  <script>
    let radarFilter = 'ALL';
    let lockedIds = new Set();
    let bannedIds = new Set();
    let playersData = [];

    // Başlangıç örnek verisi (JSON yüklenene kadar boş kalmaması için)
    playersData = [
      { id: 1, name: "Gabriel Sara", team: "GS", pos: "MID", isOOP: false, price: 8.5, ownership: 9.4, minsProb: 0.95, xg90: 0.24, xa90: 0.46, actualGI90: 0.35, oppLambda: 0.85, bonusExp: 1.6, scoutNote: "Duran top tekeli." },
      { id: 2, name: "Barış Alper Yılmaz", team: "GS", pos: "MID", isOOP: true, price: 9.0, ownership: 18.5, minsProb: 0.92, xg90: 0.45, xa90: 0.22, actualGI90: 0.48, oppLambda: 0.85, bonusExp: 1.4, scoutNote: "Mevki dışı (OOP) avantajı." }
    ];

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const json = JSON.parse(e.target.result);
          if (Array.isArray(json)) {
            playersData = json;
          } else if (json.players && Array.isArray(json.players)) {
            playersData = json.players;
          }
          alert(`✅ Başarılı! ${playersData.length} oyuncunun verisi yüklendi.`);
          recalculateAll();
        } catch (err) {
          alert("❌ Hata: Geçerli bir JSON dosyası yüklemediniz.");
        }
      };
      reader.readAsText(file);
    }

    function calcPlayerXP(p) {
      const xgWeight = parseFloat(document.getElementById('sl-xg').value);
      const matchupWeight = parseFloat(document.getElementById('sl-matchup').value);
      const goalPts = { GK: 10, DEF: 6, MID: 5, FWD: 4 }[p.pos] || 5;
      const csPts = { GK: 4, DEF: 4, MID: 1, FWD: 0 }[p.pos] || 0;
      const pCS = Math.exp(-(p.oppLambda || 1.25));
      const totalXP = (p.minsProb * 2.0) + (p.xg90 * xgWeight * goalPts) + (p.xa90 * xgWeight * 3.0) + (p.minsProb * pCS * csPts) + (p.bonusExp || 0.5);
      return { ...p, pCS, totalXP: +totalXP.toFixed(2), deltaXGI: +((p.xg90 + p.xa90) - (p.actualGI90 || 0)).toFixed(2) };
    }

    function recalculateAll() {
      document.getElementById('lbl-xg').innerText = document.getElementById('sl-xg').value + 'x';
      document.getElementById('lbl-matchup').innerText = document.getElementById('sl-matchup').value + 'x';
      document.getElementById('lbl-own').innerText = '%' + document.getElementById('sl-own').value;

      const maxOwn = parseFloat(document.getElementById('sl-own').value);
      const computed = playersData.map(calcPlayerXP).sort((a, b) => b.totalXP - a.totalXP);

      renderRadar(computed, maxOwn);
      renderTable(computed);
      solveOptimalSquad(computed);
    }

    function renderRadar(list, maxOwn) {
      const container = document.getElementById('radar-grid');
      let diffs = list.filter(p => p.ownership <= maxOwn);
      if (radarFilter === 'XG_DIFF') diffs = diffs.filter(p => p.deltaXGI >= 0.10);
      if (radarFilter === 'OOP') diffs = diffs.filter(p => p.isOOP);

      container.innerHTML = diffs.slice(0, 12).map(p => `
        <div class="card p-4 flex flex-col justify-between hover:border-emerald-500/50 transition">
          <div>
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs font-bold px-2 py-0.5 rounded bg-gray-800 text-gray-300">${p.team} • ${p.pos}</span>
                ${p.isOOP ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded badge-oop ml-1">OOP</span>` : ''}
                <h3 class="text-base font-bold text-white mt-1">${p.name}</h3>
              </div>
              <div class="text-right">
                <div class="text-lg font-extrabold text-emerald-400">${p.totalXP} xP</div>
                <div class="text-[11px] text-gray-400">${p.price}M TL • %${p.ownership}</div>
              </div>
            </div>
            <p class="text-xs text-gray-400 mt-2">${p.scoutNote || ''}</p>
          </div>
        </div>
      `).join('') || `<div class="col-span-3 text-center text-gray-400 py-8">Bu filtreye uygun oyuncu bulunamadı.</div>`;
    }

    function renderTable(list) {
      document.getElementById('table-body').innerHTML = list.map(p => `
        <tr class="hover:bg-gray-900/50">
          <td class="p-3 font-bold text-white">${p.name} ${p.isOOP ? '<span class="text-[10px] px-1.5 py-0.5 rounded badge-oop ml-1">OOP</span>' : ''}</td>
          <td class="p-3 text-gray-300">${p.team}</td>
          <td class="p-3">${p.pos}</td>
          <td class="p-3 font-semibold">${p.price}M</td>
          <td class="p-3">%${p.ownership}</td>
          <td class="p-3">${(p.xg90 + p.xa90).toFixed(2)}</td>
          <td class="p-3 font-extrabold text-emerald-400 text-sm">${p.totalXP}</td>
          <td class="p-3 flex gap-1">
            <button onclick="toggleLock(${p.id})" class="px-2 py-1 rounded text-[11px] ${lockedIds.has(p.id) ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-300'}">🔒</button>
            <button onclick="toggleBan(${p.id})" class="px-2 py-1 rounded text-[11px] ${bannedIds.has(p.id) ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-300'}">🚫</button>
          </td>
        </tr>
      `).join('');
    }

    function solveOptimalSquad(computedList) {
      const list = computedList || playersData.map(calcPlayerXP).sort((a, b) => b.totalXP - a.totalXP);
      const formStr = document.getElementById('sel-formation').value;
      const [nDEF, nMID, nFWD] = formStr.split('-').map(Number);
      const quotas = { GK: 1, DEF: nDEF, MID: nMID, FWD: nFWD };
      const teamCounts = {};
      const selected = [];
      let budget = 0;

      const available = list.filter(p => !bannedIds.has(p.id));
      available.filter(p => lockedIds.has(p.id)).forEach(p => {
        if (quotas[p.pos] > 0 && (teamCounts[p.team] || 0) < 3 && budget + p.price <= 100) {
          selected.push(p); quotas[p.pos]--; teamCounts[p.team] = (teamCounts[p.team] || 0) + 1; budget += p.price;
        }
      });
      for (const p of available) {
        if (selected.some(s => s.id === p.id)) continue;
        if (quotas[p.pos] > 0 && (teamCounts[p.team] || 0) < 3 && budget + p.price <= 85.0) {
          selected.push(p); quotas[p.pos]--; teamCounts[p.team] = (teamCounts[p.team] || 0) + 1; budget += p.price;
        }
      }

      const captain = selected.reduce((best, cur) => (!best || cur.totalXP > best.totalXP ? cur : best), null);
      const totalXP = selected.reduce((sum, p) => sum + p.totalXP + (captain && p.id === captain.id ? p.totalXP : 0), 0);

      document.getElementById('squad-cost').innerText = `${budget.toFixed(1)} / 100.0M`;
      document.getElementById('squad-xp').innerText = `${totalXP.toFixed(1)} Puan`;

      document.getElementById('pitch-container').innerHTML = ['GK', 'DEF', 'MID', 'FWD'].map(pos => `
        <div class="flex justify-around items-center my-2">
          ${selected.filter(p => p.pos === pos).map(p => `
            <div class="bg-gray-900/90 border ${captain && p.id === captain.id ? 'border-amber-400' : 'border-gray-700'} rounded-lg px-3 py-2 text-center min-w-[110px]">
              <div class="text-[10px] text-gray-400">${p.team} • ${p.price}M</div>
              <div class="text-xs font-bold text-white truncate">${p.name} ${captain && p.id === captain.id ? '©' : ''}</div>
              <div class="text-xs font-extrabold text-emerald-400 mt-0.5">${captain && p.id === captain.id ? (p.totalXP * 2).toFixed(1) : p.totalXP} xP</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function setRadarFilter(f) { radarFilter = f; recalculateAll(); }
    function toggleLock(id) { lockedIds.has(id) ? lockedIds.delete(id) : (bannedIds.delete(id), lockedIds.add(id)); recalculateAll(); }
    function toggleBan(id) { bannedIds.has(id) ? bannedIds.delete(id) : (lockedIds.delete(id), bannedIds.add(id)); recalculateAll(); }
    function switchTab(tab) {
      ['radar', 'table', 'solver'].forEach(t => {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-' + t).className = t === tab ? 'px-3 py-2 rounded-lg text-xs font-bold bg-emerald-600 text-white' : 'px-3 py-2 rounded-lg text-xs font-bold bg-gray-800 text-gray-300';
      });
    }

    window.addEventListener("DOMContentLoaded", () => recalculateAll());
  </script>
</body>
</html>
